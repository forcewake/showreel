[project]
name = "showreel"
version = "0.3.1"
description = "Convert asciinema .cast recordings to SVG, MP4, WebM, MKV (with chapters), GIF, APNG, HTML, transcripts and more — built for humans and AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pavel Nasovich" }]
keywords = ["asciinema", "asciicast", "terminal", "svg", "gif", "mp4", "webm", "mkv", "chapters", "screencast", "cli", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Utilities",
]
dependencies = [
    "pyte>=0.8.2",
    "Pillow>=11.0",
]

[project.urls]
Homepage = "https://github.com/forcewake/showreel"
Repository = "https://github.com/forcewake/showreel"
Issues = "https://github.com/forcewake/showreel/issues"
Changelog = "https://github.com/forcewake/showreel/releases"

[project.scripts]
showreel = "showreel.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/showreel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
